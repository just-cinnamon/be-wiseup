# =============================================================================
# WiseUp Backend – Quarkus Configuration
# Copy this file to .env or set environment variables in your cloud provider.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=${PORT:8080}
# Trust one proxy hop (cloud load-balancer) so req IP is the real client IP
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=false
quarkus.http.proxy.trusted-proxies=0.0.0.0/0

# CORS – comma-separated origins; override in production
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=
quarkus.http.cors.access-control-max-age=86400

# ---------------------------------------------------------------------------
# DataSource – PostgreSQL
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wiseup}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=10

# ---------------------------------------------------------------------------
# Flyway – schema migrations
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n

# ---------------------------------------------------------------------------
# Health
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/api/health

# ---------------------------------------------------------------------------
# Application settings (all overridable via env-vars)
# ---------------------------------------------------------------------------

# External Upstream Media Provider API
wiseup.upstream.base-url=${UPSTREAM_BASE_URL:https://www.pornhub.com/webmasters}
wiseup.upstream.embed-base-url=${EMBED_BASE_URL:https://www.pornhub.com/embed}
wiseup.upstream.timeout-ms=${UPSTREAM_TIMEOUT_MS:8000}

# In-memory cache for upstream responses
wiseup.cache.ttl-seconds=${CACHE_TTL_SECONDS:600}
wiseup.cache.max-entries=${CACHE_MAX_ENTRIES:500}
wiseup.cache.max-stale-seconds=${CACHE_MAX_STALE_SECONDS:3600}

# Session
wiseup.session.ttl-hours=${SESSION_TTL_HOURS:12}

# Brute-force protection
wiseup.auth.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
wiseup.auth.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# reCAPTCHA v2 – leave empty to disable
wiseup.captcha.secret=${RECAPTCHA_SECRET:}
wiseup.captcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Guest sessions (entry without an account) – per-IP hourly cap; 0 disables it
wiseup.guest.max-per-hour=${GUEST_MAX_PER_HOUR:30}

# Seed users (comma-separated email:password pairs)
wiseup.seed-users=${SEED_USERS:}

# Legal document versions (bump to force re-acceptance)
wiseup.legal.versions.termos=${LEGAL_VERSION_TERMOS:2026-11-05}
wiseup.legal.versions.privacidade=${LEGAL_VERSION_PRIVACIDADE:2026-11-05}

# Access-log retention (Marco Civil da Internet art.15)
wiseup.access-log.retention-days=${ACCESS_LOG_RETENTION_DAYS:180}

# Origin sync interval
wiseup.sync.interval-hours=${SYNC_INTERVAL_HOURS:6}
wiseup.sync.pages=${SYNC_PAGES:2}

# ---------------------------------------------------------------------------
# Dev / test profile overrides
# ---------------------------------------------------------------------------
%dev.quarkus.log.level=DEBUG
# Developing the +18 gate means crossing it over and over.
%dev.wiseup.guest.max-per-hour=1000

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:wiseuptest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=true
